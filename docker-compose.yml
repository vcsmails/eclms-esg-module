version: '3.8'

services:
  flowable-engine:
    image: flowable/flowable-rest:7.2.0
    container_name: eclms-esg-flowable
    ports:
      - "8180:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/eclms_esg
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - FLOWABLE_REST_APP_ADMIN_USER_ID=admin
      - FLOWABLE_REST_APP_ADMIN_PASSWORD=test
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped